name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just fmt-check
      - run: just clippy

  # Nothing in the code, tests, or any other job reads crates/byos/openapi.yml,
  # so without this the spec drifts silently. Separate job so the Rust lint job
  # stays free of node, same split services uses.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than inheriting whatever node the runner image ships:
      # GitHub bumps that on its own schedule, and the linters are the only
      # thing here that cares.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: extractions/setup-just@v2
      - run: just lint-openapi

  # The vendored contract artifacts must match the pinned byos-contracts
  # submodule (ADR-0014). Separate job so the lint and test jobs stay free of
  # both submodules and foundry.
  abis:
    runs-on: ubuntu-latest
    steps:
      # No `submodules:` — `just sync-abis` populates byos-contracts and its
      # own dependencies itself. Checking out recursively here would also drag
      # in offline-mode's nested submodules (cowprotocol/services, cowswap),
      # which this job has no use for.
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: extractions/setup-just@v2
      - run: just sync-abis
      - name: Fail if the vendored artifacts are stale
        run: |
          git diff --exit-code -- \
            crates/byos-common/abis/ crates/e2e/testdata/artifacts/
